---
- name: Validate inventory and prepare NFS nodes
  hosts: nfs_servers:nfs_clients
  become: true
  any_errors_fatal: true

  pre_tasks:
    - name: Require exactly one explicitly selected NFS server
      ansible.builtin.assert:
        that:
          - groups.get('nfs_servers', []) | length == 1
          - nfs_server_host in groups.get('nfs_servers', [])
          - nfs_server_host not in groups.get('nfs_clients', [])
        fail_msg: >-
          Select exactly one NFS server and do not also place it
          in nfs_clients.
      run_once: true

    - name: Validate basic configuration
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Rocky'
          - ansible_facts['distribution_major_version'] == '9'
          - cluster_ip is defined
          - nfs_export_root is match('^/[^\\s]+$')
          - nfs_export_root != '/'
          - not nfs_export_root.endswith('/')
          - nfs_shares | length > 0
          - >-
            (nfs_shares | map(attribute='name') | list | unique | length)
            == (nfs_shares | length)
          - >-
            (nfs_shares | map(attribute='client_path') | list | unique | length)
            == (nfs_shares | length)

    - name: Validate share definitions
      ansible.builtin.assert:
        that:
          - item.name is match('^[A-Za-z0-9_-]+$')
          - item.client_path is match('^/[^\\s]+$')
          - item.client_path != '/'
          - item.owner is defined
          - item.group is defined
          - item.mode is defined
          - item.export_options is defined
          - item.required_mount is defined
      loop: "{{ nfs_shares }}"
      loop_control:
        label: "{{ item.name }}"

  roles:
    - nfs_common

- name: Configure NFS server before clients
  hosts: nfs_servers
  become: true
  any_errors_fatal: true
  roles:
    - nfs_server

- name: Configure NFS clients
  hosts: nfs_clients
  become: true
  roles:
    - nfs_client