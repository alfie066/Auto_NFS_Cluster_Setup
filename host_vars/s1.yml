---
# Existing firewalld zone handling the server's internal interface.
# Verify this value on the server before running.
nfs_firewall_zone: public

# Optional existing local filesystems to mount before exporting.
nfs_storage_mounts:
  - path: /srv/nfs/shared
    device: /dev/sdb
    fstype: xfs
    create_filesystem: true
    opts: defaults